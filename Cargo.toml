[workspace]
resolver = "2"
members = ["crates/pt-core", "crates/pt-sim2d", "crates/pt-sim3d", "crates/pt-app", "crates/pt-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
pt-core = { path = "crates/pt-core" }
pt-sim2d = { path = "crates/pt-sim2d" }
pt-sim3d = { path = "crates/pt-sim3d" }
pt-bench = { path = "crates/pt-bench" }
wgpu = "30.0.1"
winit = "0.30.13"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = { version = "0.36.2", default-features = false }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
glam = { version = "0.34", features = ["bytemuck"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
