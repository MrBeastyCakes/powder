[package]
name = "pt-app"
description = "Powder Toy Next, Phase 0: the touch app with the 2D and 3D prototypes"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pt_app"
# cdylib is what Android loads; the rlib feeds the desktop dev binary.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "powder-toy"
path = "src/main.rs"

[dependencies]
pt-core.workspace = true
pt-sim2d.workspace = true
pt-sim3d.workspace = true
pt-bench.workspace = true
wgpu.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit = { workspace = true, features = ["wayland", "x11"] }
log.workspace = true
pollster.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
egui-winit = { workspace = true, features = ["android-native-activity"] }
winit = { workspace = true, features = ["android-native-activity"] }
android_logger = "0.15"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger.workspace = true

# Android packaging with cargo-apk (see mobile/android/README.md).
[package.metadata.android]
package = "app.powdertoy.next"
apk_name = "powder-toy-next"
build_targets = ["aarch64-linux-android"]
resources = "../../mobile/android/res"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
label = "Powder Toy Next"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
orientation = "portrait"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|density|uiMode"

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = true
version = 0
