name: Android APK

on:
  push:
    branches: [main]
    # A version tag such as v0.1.0-alpha.1 publishes a release of its own.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Signing key
        # Every build must be signed with the same key, or Android refuses to
        # install it over the last one and the app has to be uninstalled
        # first, which deletes its saves. The key lives in two repository
        # secrets: ANDROID_KEYSTORE_BASE64 (the keystore, base64-encoded) and
        # ANDROID_KEYSTORE_PASSWORD. Without them (a fork, or before they are
        # set up) the build makes a throwaway key and says so.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/powder.keystore
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK has a throwaway key and will not install over an earlier build."
            keytool -genkeypair -keystore ~/.android/powder.keystore -storepass android \
              -alias powder -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Powder Toy Next test build"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          # A sideloading key for test builds, not for a store.
          export CARGO_APK_RELEASE_KEYSTORE="$HOME/.android/powder.keystore"
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          cargo apk build -p pt-app --lib --release
          find target -name "*.apk" -path "*release*"
          cp target/release/apk/powder-toy-next.apk powder-toy-next.apk
      - uses: actions/upload-artifact@v4
        with:
          name: powder-toy-next-apk
          path: powder-toy-next.apk
      - name: Publish as the "latest-apk" release
        if: github.event_name != 'pull_request' && github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk powder-toy-next.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest APK" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Open this page on your Android phone and tap powder-toy-next.apk to install (allow installs from your browser when asked)."
      - name: Publish version releases
        # A version release is published by pushing its tag, or by merging
        # release-notes/<tag>.md to main: each notes file without a release
        # yet gets one, tagged at this commit. A tag with a hyphen (alpha,
        # beta, rc) is marked as a pre-release.
        if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="$GITHUB_REF_NAME"
          else
            tags=""
            for f in release-notes/v*.md; do
              [ -e "$f" ] || continue
              t=$(basename "$f" .md)
              gh release view "$t" > /dev/null 2>&1 || tags="$tags $t"
            done
          fi
          for tag in $tags; do
            cp powder-toy-next.apk "powder-toy-next-$tag.apk"
            pre=""
            case "$tag" in *-*) pre="--prerelease" ;; esac
            notes="release-notes/$tag.md"
            [ -f "$notes" ] || echo "Built from ${GITHUB_SHA::7}." > "$notes"
            gh release create "$tag" "powder-toy-next-$tag.apk" $pre --latest=false --target "$GITHUB_SHA" \
              --title "Powder Toy Next $tag" --notes-file "$notes"
          done
